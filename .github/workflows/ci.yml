name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types (strict)
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: Audit des dépendances de production (vulnérabilités hautes)
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations + tests de sécurité SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # base jetable, accessible uniquement depuis le job
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rejouer toutes les migrations de zéro et lancer les tests RLS
        run: npm run test:db
